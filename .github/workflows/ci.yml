name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: node --check main.js
      - name: Unit tests
        run: npm test
      - name: Hard QA
        run: npm run test:hard --if-present
      - name: Packaged plugin test
        run: npm run test:packaged --if-present
      - name: Dry-run package
        run: npm run pack:dry
